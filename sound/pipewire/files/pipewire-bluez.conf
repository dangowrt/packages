<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-mode PipeWire runs pipewire/wireplumber as the dedicated 'pipewire'
  user. BlueZ's default policy (bluetooth.conf) only lets root and the default
  context *send* to org.bluez; it does NOT let this user reply to bluetoothd's
  MediaEndpoint callbacks. Without the rules below, bluetoothd rejects the
  method-return replies ("Rejected send message ... 0 matched rules") and A2DP
  transport setup fails with "Resource busy", so paired speakers never appear
  as a sink. Grant the pipewire user the org.bluez access it needs.
-->
<busconfig>
  <policy user="pipewire">
    <allow send_destination="org.bluez"/>
    <allow receive_sender="org.bluez"/>
    <!-- Reply to bluetoothd's MediaEndpoint1/Profile1 method calls. The reply's
         destination is bluetoothd's *unique* connection name, which
         send_destination="org.bluez" does NOT match, so bluetoothd's calls time
         out and A2DP setup fails with "Resource busy". Allow requested
         method_return/error replies explicitly - this is the rule the comment
         above promised but the original policy was missing. -->
    <allow send_requested_reply="true" send_type="method_return"/>
    <allow send_requested_reply="true" send_type="error"/>
    <allow send_interface="org.bluez.MediaEndpoint1"/>
    <allow send_interface="org.bluez.MediaPlayer1"/>
    <allow send_interface="org.bluez.Profile1"/>
    <allow send_interface="org.bluez.GattCharacteristic1"/>
    <allow send_interface="org.bluez.GattDescriptor1"/>
    <allow send_interface="org.freedesktop.DBus.ObjectManager"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
