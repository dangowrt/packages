# Better Bluetooth audio quality.
# - SBC-XQ: high-bitpool SBC variant (~551 kbps, near-transparent) - vastly
#   better than default SBC and supported by most modern speakers/headphones.
#   Without this the default SBC negotiation is the weakest link in the chain
#   (audible harshness on good gear).
monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
}
