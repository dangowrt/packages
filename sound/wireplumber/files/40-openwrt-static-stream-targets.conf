# Static stream targeting for this appliance.
#
# Every audio stream on this box declares its output sink explicitly via
# target.object (snapclient-spdif -> alsa_output.spdif, the per-device BT
# snapclients -> their bluez sink, librespot -> the snapserver capture sink).
#
# WirePlumber's restore-stream would override those explicit targets: it saves
# "where did this stream play last" and re-applies it via metadata (which takes
# priority over the node's own target.object). Worse, its save-key follows the
# PulseAudio identification order, where media.role wins - and snapclient sets
# media.role = Music on every stream - so ALL snapclient streams share ONE saved
# target and get collectively yanked onto whatever sink one of them used last
# (observed: the SPDIF client playing on a Bluetooth speaker).
#
# On a headless appliance with fully declared routing there is nothing to
# "restore" - disable stream-target restore so target.object is always honored.
#
# linking.follow-default-target additionally moves streams along when the
# default sink changes (observed: flipping the default dragged the SPDIF
# client onto the Bluetooth speaker despite its explicit target). Explicitly
# targeted streams must never follow the default, so turn that off as well.
wireplumber.settings = {
  node.stream.restore-target = false
  linking.follow-default-target = false
}
