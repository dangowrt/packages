# Realtime scheduling without RTKit.
#
# module-rt prefers the RTKit/portal D-Bus path whenever D-Bus is available in
# the process (it is here - BlueZ needs it). OpenWrt has no RTKit service, so
# that path silently yields NO realtime at all: the audio data-loops end up
# SCHED_OTHER and crackle under CPU load ("out of buffers" in audioconvert).
# Force the direct sched_setscheduler path instead - the services get the
# required RLIMIT_RTPRIO from their procd init (limits rtprio).
# nice.level 20 = "do not change niceness": renicing needs privileges we do not
# grant, and a failed renice makes module-rt fall back to RTKit again.
module.rt.args = {
  rtkit.enabled = false
  rtportal.enabled = false
  nice.level = 20
}
