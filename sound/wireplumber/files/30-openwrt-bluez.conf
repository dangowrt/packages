# Enable WirePlumber's Bluetooth monitor. Installed only when Bluetooth is
# enabled (WIREPLUMBER_BLUETOOTH, defaulting to pipewire's PIPEWIRE_BLUETOOTH).
# Loaded after 20-openwrt-no-dbus.conf, so this re-enables the bluez monitor the
# alsa-only base profile disables. Needs bluez-daemon + D-Bus running at runtime.
wireplumber.profiles = {
  main = {
    monitor.bluez = required
  }
}
